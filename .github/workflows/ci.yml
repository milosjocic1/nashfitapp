name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `if: always()` on the checks below so one failure doesn't mask the
      # others — a single push reports every problem at once.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: always()
        run: npm run typecheck

      - name: Format check
        if: always()
        run: npm run format:check

      # Completes build-plan task 0.8. Deliberately deferred until there was
      # logic worth covering rather than a green suite testing nothing; the
      # library filters were the first such piece. Per CLAUDE.md the coverage
      # that matters next is plan-output validation (6.3), offline-sync
      # reconciliation (8.3) and subscription state (2.4).
      - name: Test
        if: always()
        run: npm test -- --ci
